services:
  - type: web
    name: stet-tre-study-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/study_dashboard.sqlite3
    disk:
      name: study-data
      mountPath: /var/data
      sizeGB: 1
